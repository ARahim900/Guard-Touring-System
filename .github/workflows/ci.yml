# Runs on every push and pull request. A red check means: do not deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Database and report tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The guard outbox test imports the portal's offline storage library.
      - run: npm ci
        working-directory: apps/portal
      - run: npm ci
        working-directory: tests
      # Applies every migration to an in-memory Postgres, then runs the tests.
      - run: npm test
        working-directory: tests

  portal:
    name: Supervisor portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  guard:
    name: Guard app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      # Report only: the known advisories come from Expo's own dependencies
      # and are cleared by an Expo SDK upgrade, not by this repository.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  portal-ios:
    name: Supervisor iPhone app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/portal-ios/ios
    steps:
      - uses: actions/checkout@v4
      - run: pod install
      - run: xcodebuild -workspace MBPatrol.xcworkspace -scheme MBPatrol -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
