# XcodeGen spec for the MB Patrol iPhone app. Regenerate the Xcode project
# after changing this file:  cd apps/portal-ios/ios && xcodegen generate
name: MBPatrol
options:
  bundleIdPrefix: com.muscatbay.patrol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ZQ4KZK5S6J
    SWIFT_VERSION: "5.0"
targets:
  MBPatrol:
    type: application
    platform: iOS
    sources:
      - path: MBPatrol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muscatbay.patrol.supervisor
        PRODUCT_NAME: MBPatrol
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MBPatrol/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  MBPatrol:
    build:
      targets:
        MBPatrol: all
    run:
      config: Debug
    archive:
      config: Release
