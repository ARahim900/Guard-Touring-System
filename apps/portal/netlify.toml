# The portal now lives at https://securitymb.vercel.app (deployed by Vercel from
# this repository). The old Netlify address only forwards visitors there.
#
# netlify-forward/ holds one file, sw.js, which retires the old offline copy on
# phones that installed the Netlify site. Every other address is redirected
# permanently, keeping the page path (for example /reports).
[build]
  command = "echo Forwarding to securitymb.vercel.app"
  publish = "netlify-forward"

[[redirects]]
  from = "/*"
  to = "https://securitymb.vercel.app/:splat"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
